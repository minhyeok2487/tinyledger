{{define "scripts"}}
<script>
// Every write in this app is a full form POST + redirect, so without feedback
// a click looks like nothing happened. One delegated listener marks the
// submitting form busy; CSS turns its button into a spinner.
(function () {
  var TIMEOUT = 15000;
  var timer = null;

  function clearBusy() {
    clearTimeout(timer);
    document.documentElement.classList.remove('nav-busy');
    document.querySelectorAll('form.busy').forEach(function (f) {
      f.classList.remove('busy');
      f.querySelectorAll('button[disabled]').forEach(function (b) { b.disabled = false; });
    });
  }

  // Bubble phase, so an inline onsubmit="return confirm(...)" has already run
  // by now. Cancelling it only calls preventDefault — the event still reaches
  // us — so check that explicitly or the spinner would spin forever.
  document.addEventListener('submit', function (e) {
    if (e.defaultPrevented) return;
    var form = e.target;
    if (!(form instanceof HTMLFormElement)) return;
    if (form.classList.contains('busy')) { e.preventDefault(); return; }

    form.classList.add('busy');
    document.documentElement.classList.add('nav-busy');
    // Deferred so the button's own name/value still makes it into the POST.
    setTimeout(function () {
      var btn = form.querySelector('button[type=submit], button:not([type])');
      if (btn) btn.disabled = true;
    }, 0);
    timer = setTimeout(clearBusy, TIMEOUT);
  });

  // Back button restoring the page from bfcache would otherwise show a
  // spinner that never stops.
  window.addEventListener('pageshow', clearBusy);
})();
</script>
{{end}}
